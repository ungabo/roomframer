<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account | Wall Framing Designer</title>
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <header class="auth-hero">
        <div class="auth-kicker">Wall Framing Designer</div>
        <h1>Create account</h1>
        <p>Each account gets its own saved projects and framing presets.</p>
      </header>
      <div class="auth-body">
        <form class="auth-form" data-auth-form="register">
          <div class="auth-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="auth-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required>
          </div>
          <div class="auth-field">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
          </div>
          <div id="authStatus" class="auth-status" aria-live="polite"></div>
          <button class="btn primary auth-submit" type="submit">Create Account</button>
        </form>
        <div class="auth-note">Use the email address you want tied to your saved projects and presets.</div>
        <div class="auth-links">Already have an account? <a href="/login">Sign in</a></div>
      </div>
    </section>
  </main>
  <script src="/static/js/auth.js"></script>
</body>
</html>
